              "@type": "Question",
              "name": "How much down payment do I really need in the US?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "While 20% down eliminates Private Mortgage Insurance (PMI), it is not mandatory. Conventional loans can be secured with as little as 3% down, FHA loans require 3.5%, and VA/USDA loans offer 0% down options for eligible borrowers."
              }
            },
            {
              "@type": "Question",
              "name": "What credit score is required for a conventional home loan?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Most conventional lenders require a minimum credit score of 620. Borrowers with scores of 740 and above receive the most competitive interest rates and lower insurance charges."
              }
            },
            {
              "@type": "Question",
              "name": "What is the 28/36 qualifying rule used by US lenders?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "The 28/36 rule is a standard DTI metric. Lenders prefer your front-end housing cost (PITI) stays below 28% of your gross monthly income, and your total monthly debt payments remain under 36%."
              }
            },
            {
              "@type": "Question",
              "name": "Should I choose a 15-year or a 30-year fixed loan?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "A 30-year loan offers lower monthly payments and cash-flow flexibility. A 15-year loan requires higher monthly payments but comes with a lower interest rate, cutting lifetime borrowing costs dramatically."
              }
            }
          ]
